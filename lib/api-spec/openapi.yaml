openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: config
    description: Public browser configuration
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /config/supabase.js:
    get:
      operationId: getSupabaseBrowserConfig
      tags: [config]
      summary: Get the public Supabase browser configuration
      description: Returns a browser script containing only the Supabase project URL and publishable key.
      responses:
        "200":
          description: Configuration script, or a browser-readable missing-configuration marker.
          content:
            text/javascript:
              schema:
                type: string
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

