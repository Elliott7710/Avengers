<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2b2b2b" />
    <meta name="description" content="Sign in to your FlowGuard workspace." />
    <title>FlowGuard — Sign in</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="auth-page">
    <main class="auth-wrapper">
      <a class="auth-brand brand" href="index.html" aria-label="FlowGuard home">
        <span class="brand-mark">FG</span>
        <span>FlowGuard</span>
      </a>

      <section class="auth-box" aria-labelledby="login-title">
        <div class="auth-header">
          <span id="login-title">Welcome back</span>
        </div>
        <p class="auth-intro">Sign in to access your FlowGuard workspace.</p>

        <form class="auth-form" id="loginForm">
          <div class="auth-field">
            <label for="email">Email address</label>
            <input
              id="email"
              name="email"
              type="email"
              autocomplete="email"
              placeholder="you@example.com"
              required
            />
          </div>

          <div class="auth-field">
            <label for="password">Password</label>
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              placeholder="Enter your password"
              required
            />
          </div>

          <button class="auth-submit" type="submit">Sign in</button>
        </form>

        <p class="auth-switch">
          Don't have an account?
          <a href="registration.html">Create account</a>
        </p>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/api/config/supabase.js"></script>
    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>
  </body>
</html>
